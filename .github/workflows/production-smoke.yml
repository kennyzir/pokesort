name: Production SEO smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0 * * *"
    - cron: "25 12 * * *"

permissions:
  contents: read

concurrency:
  group: production-seo-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run production smoke with bounded retries
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            echo "Production smoke attempt ${attempt}/7 (initial attempt plus at most 6 retries)"
            if npm run smoke:production; then
              exit 0
            fi
            if [ "${attempt}" -eq 7 ]; then
              echo "Production smoke failed after the initial attempt and 6 retries"
              exit 1
            fi
            sleep 60
          done
