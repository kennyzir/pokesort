<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokeSort Archive — Previous Daily Pokémon Puzzles</title><meta name="description" content="Play previous PokeSort daily Pokémon sorting puzzles from the archive."><link rel="canonical" href="https://pokesort.example/archive/"><link rel="stylesheet" href="/assets/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-ball"></span><span>POKE<strong>SORT</strong></span></a><nav><a href="/">Daily</a><a href="/?mode=infinite#game">Infinite</a><a aria-current="page" href="/archive/">Archive</a><a href="/how-to-play/">How to play</a></nav></header><main class="content-page"><p class="section-label">PREVIOUS BOARDS</p><h1>PokeSort Archive</h1><p class="lede">Missed a day? Open any of the last 30 daily Pokémon sorting puzzles. Archive games do not change your current streak.</p><div class="archive-grid" id="archive-grid"></div></main><footer><div><a class="brand footer-brand" href="/"><span class="brand-ball"></span><span>POKE<strong>SORT</strong></span></a></div><div class="footer-links"><a href="/">Today</a><a href="/?mode=infinite#game">Infinite</a></div></footer><script>const grid=document.querySelector('#archive-grid'),fmt=new Intl.DateTimeFormat('en',{month:'short',day:'numeric',year:'numeric'});for(let i=1;i<=30;i++){const d=new Date;d.setUTCDate(d.getUTCDate()-i);const key=d.toISOString().slice(0,10);grid.insertAdjacentHTML('beforeend',`<a class="archive-card" href="/?date=${key}#game"><strong>PokeSort ${key}</strong><span>${fmt.format(d)} · Play board →</span></a>`)}</script></body></html>
